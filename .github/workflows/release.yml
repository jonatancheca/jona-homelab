name: Release app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Prepare version
        shell: bash
        run: |
          version="main-${GITHUB_SHA::12}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Validate production build
        run: pnpm test:production

      - name: Validate updater
        shell: bash
        run: |
          bash -n deploy/update.sh
          sudo bash tests/release-update.test.sh

      - name: Package Linux release
        shell: bash
        run: |
          package_root='artifacts/package'
          mkdir -p "$package_root/deploy"
          cp -a .output/. "$package_root/"
          install -m 0755 deploy/update.sh "$package_root/update.sh"
          install -m 0644 README.md "$package_root/README.md"
          install -m 0644 deploy/homelab.env.example "$package_root/deploy/homelab.env.example"
          install -m 0644 deploy/jona-homelab.service "$package_root/deploy/jona-homelab.service"
          printf '%s\n' "$APP_VERSION" > "$package_root/RELEASE_VERSION"

          tar -czf artifacts/jona-homelab.tar.gz --directory "$package_root" .
          (cd artifacts && sha256sum jona-homelab.tar.gz > jona-homelab.tar.gz.sha256)
          install -m 0755 deploy/update.sh artifacts/update.sh

          tar -tzf artifacts/jona-homelab.tar.gz | sed 's#^\./##' > artifacts/manifest.txt
          for required in \
            RELEASE_VERSION \
            server/index.mjs \
            update.sh \
            README.md \
            deploy/homelab.env.example \
            deploy/jona-homelab.service
          do
            grep -Fxq "$required" artifacts/manifest.txt
          done
          (cd artifacts && sha256sum --check jona-homelab.tar.gz.sha256)

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            artifacts/jona-homelab.tar.gz
            artifacts/jona-homelab.tar.gz.sha256
            artifacts/update.sh

  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Test companion
        run: dotnet test companion/JonaHomelab.Companion.sln --configuration Release

      - name: Publish companion
        shell: pwsh
        run: |
          $version = "main-$($env:GITHUB_SHA.Substring(0, 12))"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\companion-package'
          dotnet publish companion/JonaHomelab.Companion.csproj --configuration Release --runtime win-x64 --self-contained true --output $packageRoot
          Copy-Item companion/install.ps1, companion/uninstall.ps1, companion/README.md -Destination $packageRoot
          Set-Content -LiteralPath (Join-Path $packageRoot 'RELEASE_VERSION') -Value $version -NoNewline
          foreach ($required in @('JonaHomelab.Companion.exe', 'install.ps1', 'uninstall.ps1', 'README.md', 'RELEASE_VERSION')) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $required))) { throw "Missing Companion package file: $required" }
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE 'artifacts\jona-homelab-companion-win-x64.zip'
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zip
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = $archive.Entries.FullName
            foreach ($required in @('JonaHomelab.Companion.exe', 'install.ps1', 'uninstall.ps1', 'README.md', 'RELEASE_VERSION')) {
              if ($entries -notcontains $required) { throw "Missing Companion ZIP entry: $required" }
            }
          } finally { $archive.Dispose() }
          (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower() + "  " + (Split-Path $zip -Leaf) | Set-Content -LiteralPath "$zip.sha256" -NoNewline

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            artifacts/jona-homelab-companion-win-x64.zip
            artifacts/jona-homelab-companion-win-x64.zip.sha256

  publish:
    if: github.ref == 'refs/heads/main'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="main-${GITHUB_SHA::12}"
          repository="$GITHUB_REPOSITORY"
          assets=(
            artifacts/jona-homelab.tar.gz
            artifacts/jona-homelab.tar.gz.sha256
            artifacts/update.sh
            artifacts/jona-homelab-companion-win-x64.zip
            artifacts/jona-homelab-companion-win-x64.zip.sha256
          )
          if gh release view "$version" --repo "$repository" >/dev/null 2>&1; then
            gh release upload "$version" "${assets[@]}" --repo "$repository" --clobber
            gh release edit "$version" --repo "$repository" --title "Jona Homelab $version" --latest
          else
            gh release create "$version" "${assets[@]}" --repo "$repository" --target "$GITHUB_SHA" --title "Jona Homelab $version" --generate-notes --latest
          fi
